spring:
  application:
    name: farmer
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 2829
bakong:
  api:
    token: ${token}
  account:
    id: ${accountId}
  merchant:
    name: BUN RAKSA
    city: Phnom Penh
